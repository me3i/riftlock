name: Linux releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            linker: musl-gcc
            packages: musl-tools
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            linker: musl-gcc
            packages: musl-tools
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build static binary
        env:
          CARGO_TARGET_LINKER: ${{ matrix.linker }}
        run: |
          target_key="$(printf '%s' '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')"
          linker_var="CARGO_TARGET_${target_key}_LINKER"
          env "$linker_var=${{ matrix.linker }}" cargo build --release -p riftlock-cli --target "${{ matrix.target }}"
          install -m 0755 "target/${{ matrix.target }}/release/riftlock" "riftlock-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: riftlock-${{ matrix.target }}
          path: riftlock-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: riftlock-*
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum riftlock-* > checksums.txt
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/riftlock-x86_64-unknown-linux-musl
            release-assets/riftlock-aarch64-unknown-linux-musl
            release-assets/checksums.txt
          generate_release_notes: true
